name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm i
      - run: |
          echo ">>> Start compile vscode-office."
          npm run build
          echo ">>> Compile vscode-office sucess!"
